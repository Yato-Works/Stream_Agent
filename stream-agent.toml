# Example Stream Agent configuration (see Plan.md section 13.2).

[server]
host = "127.0.0.1"
port = 8789
max_concurrent_requests = 1
request_timeout_seconds = 3600
allow_remote_bind = false

[storage]
root = "~/.stream-agent"
weight_cache_limit_gib = 100
managed_store_limit_gib = 105
metadata_reserve_mib = 256
staging_reserve_mib = 768
quota_policy = "fixed"      # fixed | elastic
eviction_policy = "lru"
verify_before_use = true
block_size_bytes = 8388608

[source.huggingface]
enabled = true
token_env = "HF_TOKEN"
max_parallel_ranges = 4
request_timeout_seconds = 120
retry_limit = 4

# ---------------------------------------------------------------------------
# 100 GB SSD Multi-Model Setup: Qwen (20GB) + DeepSeek (40GB) + Kimi (40GB)
# ---------------------------------------------------------------------------

[models.qwen27b]
repo = "Qwen/Qwen3.8-27B"
revision = "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
format = "safetensors"
weight_cache_quota_gib = 20
quota_mode = "fixed"
license_review = "accepted"
allow_remote_code = false

