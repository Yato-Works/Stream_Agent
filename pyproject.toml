[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-agent"
version = "0.1.0.dev0"
description = "Storage-budgeted on-demand model runtime: bounded local weight cache with remote-backed weight retrieval."
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Eli" }]
keywords = ["llm", "cache", "moe", "inference", "weights"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
]

dependencies = [
  "httpx>=0.27",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Local inference endpoint (C8) and the job/MCP adapters.
server = ["fastapi>=0.110", "uvicorn>=0.27"]
# Remote-backed safetensors backend (C7).
torch = ["torch>=2.2", "numpy>=1.24", "safetensors>=0.4", "transformers>=4.40", "gguf>=0.10.0", "accelerate>=0.26"]
# Hub metadata helpers for the source adapter (C2).
hub = ["huggingface_hub>=0.26"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]
benchmark = ["psutil>=5.9"]

[project.scripts]
stream-agent = "stream_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "network: tests that require outbound network access to a model repository",
  "slow: long running tests",
]
